name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-tests:
    name: shared androidHostTest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run shared host tests
        run: ./gradlew :shared:testAndroidHostTest --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shared-test-report
          path: shared/build/reports/tests/testAndroidHostTest/
          if-no-files-found: ignore

  server-tests:
    name: server tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run server tests
        run: ./gradlew :server:test --stacktrace

      - name: Upload server test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-report
          path: server/build/reports/tests/test/
          if-no-files-found: ignore

  ios-tests:
    name: shared iosSimulatorArm64Test
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run shared iOS simulator tests
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace

  maestro:
    name: maestro welcome a11y
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Assemble debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Run Maestro flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          script: |
            export PATH="$PATH:$HOME/.maestro/bin"
            APK=$(find androidApp/build/outputs/apk -name '*.apk' | head -n 1)
            adb install -r "$APK"
            maestro test maestro/flows/welcome_a11y.yaml

  ios-size:
    name: iOS ipa size budget (when archived)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce 40 MiB IPA budget if present
        run: |
          chmod +x scripts/check-ipa-size.sh
          ./scripts/check-ipa-size.sh

  app-size:
    name: android debug APK size budget
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APKs
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Enforce 40 MiB budget
        run: |
          chmod +x scripts/check-app-size.sh
          ./scripts/check-app-size.sh

      - name: Enforce 16 KB ELF alignment
        run: |
          chmod +x scripts/check-16kb-elf.sh
          ./scripts/check-16kb-elf.sh
