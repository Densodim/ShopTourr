spring:
  application:
    name: voyage-api
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./build/voyage;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

voyage:
  jwt:
    secret: ${VOYAGE_JWT_SECRET:voyage-dev-hmac-secret-change-me-32b!}
    access-ttl: 15m
    refresh-ttl: 30d
  client:
    min-android-build: 1
    min-ios-build: 1
    soft-min-android-build: 1
    soft-min-ios-build: 1
    store-url-android: https://play.google.com/store/apps/details?id=com.shoptourr
    store-url-ios: https://apps.apple.com/app/id000000000
    flags:
      export-pdf: true
      ocr-assist: true
      native-maps: false
